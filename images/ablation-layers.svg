<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="Layer-by-layer ablation. full R@1=0.825 MRR=0.907; minus Node-BM25 0.525/0.630 (-36%); minus Soul Boost 0.805/0.900.">
  <style>
    .bg{fill:#fafaf7}.tx{fill:#0b0b0b}.mu{fill:#52514e}.gr{fill:#c3c2b7}.gl{fill:#e1e0d9}
    .bar{fill:#16a34a}.ab{fill:#94a3b8}.warn{fill:#dc2626}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.tx{fill:#e6edf3}.mu{fill:#8b949e}.gr{fill:#30363d}.gl{fill:#21262d}
      .bar{fill:#22c55e}.ab{fill:#6e7681}.warn{fill:#f87171}
    }
  </style>
  <rect class="bg" width="620" height="200"/>
  <text x="10" y="18" font-size="13" font-weight="600" class="tx">Layer-by-layer ablation — remove one layer at a time · R@1 / MRR</text>
  <line x1="150" y1="35" x2="150" y2="165" class="gr" stroke-width="1"/>
  <line x1="255" y1="35" x2="255" y2="165" class="gl" stroke-width="1"/>
  <line x1="360" y1="35" x2="360" y2="165" class="gl" stroke-width="1"/>
  <line x1="465" y1="35" x2="465" y2="165" class="gl" stroke-width="1"/>
  <line x1="570" y1="35" x2="570" y2="165" class="gl" stroke-width="1"/>
  <text x="150" y="180" font-size="10" class="mu" text-anchor="middle">0</text>
  <text x="255" y="180" font-size="10" class="mu" text-anchor="middle">.25</text>
  <text x="360" y="180" font-size="10" class="mu" text-anchor="middle">.50</text>
  <text x="465" y="180" font-size="10" class="mu" text-anchor="middle">.75</text>
  <text x="570" y="180" font-size="10" class="mu" text-anchor="middle">1.0</text>
  <text x="142" y="60" font-size="11" class="mu" text-anchor="end">full Triple-Layer</text>
  <rect x="152" y="50" width="351" height="12" class="bar" opacity="0.95"/><text x="509" y="59" font-size="10" class="tx">R@1 .825</text>
  <rect x="152" y="64" width="385" height="10" class="bar" opacity="0.5"/><text x="543" y="72" font-size="10" class="mu">MRR .907</text>
  <text x="142" y="100" font-size="11" class="mu" text-anchor="end">−Node-BM25</text>
  <rect x="152" y="90" width="223" height="12" class="ab" opacity="0.95"/><text x="381" y="99" font-size="10" class="mu">R@1 .525</text>
  <rect x="152" y="104" width="268" height="10" class="ab" opacity="0.5"/><text x="426" y="112" font-size="10" class="mu">MRR .630</text>
  <text x="395" y="99" font-size="10" font-weight="600" class="warn">−36%</text>
  <text x="142" y="140" font-size="11" class="mu" text-anchor="end">−Soul Boost (fusion)</text>
  <rect x="152" y="130" width="342" height="12" class="ab" opacity="0.95"/><text x="500" y="139" font-size="10" class="mu">R@1 .805</text>
  <rect x="152" y="144" width="383" height="10" class="ab" opacity="0.5"/><text x="541" y="152" font-size="10" class="mu">MRR .900</text>
  <text x="10" y="194" font-size="10" class="mu">Node-BM25 is the precision engine; Soul Boost belongs in injection, not retrieval re-rank.</text>
</svg>
