<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="OKS benchmark: 50-case ablation fts5 R@1=82.5 R@3=92.5 MRR=90.7 vs native 52.5/64.7/63.0 vs fusion 80.5/90.5/90.0; embedding 61.7% at 197×; LoCoMo 1540-case recall@1 92.0% vs OpenViking 82.86%.">
  <rect x="150" y="4" width="14" height="14" rx="3" fill="#16a34a"/><text x="170" y="15" font-size="12" fill="#52514e">fts5 (Node-BM25, default)</text>
  <rect x="330" y="4" width="14" height="14" rx="3" fill="#94a3b8"/><text x="350" y="15" font-size="12" fill="#52514e">ablated / other</text>

  <!-- Section 1: Triple-Layer ablation, grouped bars R@1/R@3/MRR -->
  <text x="150" y="48" font-size="13" font-weight="600" fill="#0b0b0b">Triple-Layer ablation — 50-case · R@1 / R@3 / MRR</text>
  <line x1="150" y1="62" x2="150" y2="215" stroke="#c3c2b7" stroke-width="1"/>
  <text x="150" y="231" font-size="10" fill="#898781" text-anchor="middle">0</text>
  <line x1="312.5" y1="62" x2="312.5" y2="215" stroke="#e1e0d9" stroke-width="1"/>
  <text x="312.5" y="231" font-size="10" fill="#898781" text-anchor="middle">.25</text>
  <line x1="475" y1="62" x2="475" y2="215" stroke="#e1e0d9" stroke-width="1"/>
  <text x="475" y="231" font-size="10" fill="#898781" text-anchor="middle">.50</text>
  <line x1="637.5" y1="62" x2="637.5" y2="215" stroke="#e1e0d9" stroke-width="1"/>
  <text x="637.5" y="231" font-size="10" fill="#898781" text-anchor="middle">.75</text>
  <line x1="800" y1="62" x2="800" y2="215" stroke="#e1e0d9" stroke-width="1"/>
  <text x="800" y="231" font-size="10" fill="#898781" text-anchor="middle">1.0</text>

  <text x="138" y="92" font-size="12" fill="#52514e" text-anchor="end">fts5</text>
  <rect x="160" y="80" width="529" height="11" fill="#16a34a" opacity="0.9"/><text x="695" y="89" font-size="10" fill="#0b0b0b">R@1 .825</text>
  <rect x="160" y="93" width="594" height="11" fill="#16a34a" opacity="0.6"/><text x="760" y="102" font-size="10" fill="#52514e">R@3 .925</text>
  <rect x="160" y="106" width="582" height="11" fill="#16a34a" opacity="0.4"/><text x="748" y="115" font-size="10" fill="#52514e">MRR .907</text>

  <text x="138" y="142" font-size="12" fill="#52514e" text-anchor="end">fusion</text>
  <rect x="160" y="130" width="517" height="11" fill="#94a3b8" opacity="0.9"/><text x="683" y="139" font-size="10" fill="#52514e">R@1 .805</text>
  <rect x="160" y="143" width="581" height="11" fill="#94a3b8" opacity="0.6"/><text x="747" y="152" font-size="10" fill="#52514e">R@3 .905</text>
  <rect x="160" y="156" width="578" height="11" fill="#94a3b8" opacity="0.4"/><text x="744" y="165" font-size="10" fill="#52514e">MRR .900</text>

  <text x="138" y="192" font-size="12" fill="#52514e" text-anchor="end">native</text>
  <rect x="160" y="180" width="337" height="11" fill="#94a3b8" opacity="0.9"/><text x="503" y="189" font-size="10" fill="#52514e">R@1 .525</text>
  <rect x="160" y="193" width="415" height="11" fill="#94a3b8" opacity="0.6"/><text x="581" y="202" font-size="10" fill="#52514e">R@3 .647</text>
  <rect x="160" y="206" width="404" height="11" fill="#94a3b8" opacity="0.4"/><text x="570" y="215" font-size="10" fill="#52514e">MRR .630</text>

  <!-- Section 2: Embedding -->
  <text x="150" y="267" font-size="13" font-weight="600" fill="#0b0b0b">Embedding vs literal — semantic recall · R@1</text>
  <line x1="150" y1="281" x2="150" y2="375" stroke="#c3c2b7" stroke-width="1"/>
  <text x="150" y="391" font-size="10" fill="#898781" text-anchor="middle">0</text>
  <line x1="475" y1="281" x2="475" y2="375" stroke="#e1e0d9" stroke-width="1"/>
  <text x="475" y="391" font-size="10" fill="#898781" text-anchor="middle">.50</text>
  <line x1="800" y1="281" x2="800" y2="375" stroke="#e1e0d9" stroke-width="1"/>
  <text x="800" y="391" font-size="10" fill="#898781" text-anchor="middle">1.0</text>
  <text x="138" y="306" font-size="12" fill="#52514e" text-anchor="end">fts5</text>
  <rect x="160" y="294" width="529" height="16" rx="3" fill="#16a34a"/><text x="695" y="306" font-size="11" font-weight="600" fill="#0b0b0b">.825 · 93ms</text>
  <text x="138" y="343" font-size="12" fill="#52514e" text-anchor="end">embedding</text>
  <rect x="160" y="331" width="396" height="16" rx="3" fill="#94a3b8"/><text x="562" y="343" font-size="11" fill="#52514e">.617 · 18304ms (197×)</text>

  <!-- Section 3: LoCoMo PK -->
  <text x="150" y="427" font-size="13" font-weight="600" fill="#0b0b0b">LoCoMo long-conversation — 1540-case · OKS recall@1 vs OpenViking QA accuracy</text>
  <line x1="150" y1="441" x2="150" y2="535" stroke="#c3c2b7" stroke-width="1"/>
  <text x="150" y="551" font-size="10" fill="#898781" text-anchor="middle">0</text>
  <line x1="475" y1="441" x2="475" y2="535" stroke="#e1e0d9" stroke-width="1"/>
  <text x="475" y="551" font-size="10" fill="#898781" text-anchor="middle">.50</text>
  <line x1="800" y1="441" x2="800" y2="535" stroke="#e1e0d9" stroke-width="1"/>
  <text x="800" y="551" font-size="10" fill="#898781" text-anchor="middle">1.0</text>
  <text x="138" y="466" font-size="12" fill="#52514e" text-anchor="end">OKS recall@1</text>
  <rect x="160" y="454" width="590" height="16" rx="3" fill="#16a34a"/><text x="756" y="466" font-size="11" font-weight="600" fill="#0b0b0b">.920 · 31ms</text>
  <text x="138" y="503" font-size="12" fill="#52514e" text-anchor="end">OpenViking QA</text>
  <rect x="160" y="491" width="531" height="16" rx="3" fill="#2a78d6"/><text x="697" y="503" font-size="11" fill="#52514e">.8286</text>
  <text x="150" y="570" font-size="10" fill="#898781">Note: OKS = recall hit (upper-bounds QA); OpenViking = full QA (recall + LLM answer + judge). Not identical metrics.</text>

  <!-- Section 4: Layer-by-layer ablation -->
  <text x="150" y="608" font-size="13" font-weight="600" fill="#0b0b0b">Layer-by-layer ablation — remove one layer at a time · R@1 / MRR</text>
  <line x1="150" y1="622" x2="150" y2="700" stroke="#c3c2b7" stroke-width="1"/>
  <text x="150" y="716" font-size="10" fill="#898781" text-anchor="middle">0</text>
  <line x1="475" y1="622" x2="475" y2="700" stroke="#e1e0d9" stroke-width="1"/>
  <text x="475" y="716" font-size="10" fill="#898781" text-anchor="middle">.50</text>
  <line x1="800" y1="622" x2="800" y2="700" stroke="#e1e0d9" stroke-width="1"/>
  <text x="800" y="716" font-size="10" fill="#898781" text-anchor="middle">1.0</text>
  <text x="138" y="642" font-size="11" fill="#52514e" text-anchor="end">full Triple-Layer</text>
  <rect x="160" y="631" width="529" height="9" fill="#16a34a" opacity="0.9"/><text x="695" y="639" font-size="9" fill="#0b0b0b">R@1 .825</text>
  <rect x="160" y="641" width="582" height="9" fill="#16a34a" opacity="0.5"/><text x="748" y="649" font-size="9" fill="#52514e">MRR .907</text>
  <text x="138" y="667" font-size="11" fill="#52514e" text-anchor="end">−Node-BM25</text>
  <rect x="160" y="656" width="337" height="9" fill="#94a3b8" opacity="0.9"/><text x="503" y="664" font-size="9" fill="#52514e">R@1 .525 (−36%)</text>
  <rect x="160" y="666" width="404" height="9" fill="#94a3b8" opacity="0.5"/><text x="570" y="674" font-size="9" fill="#52514e">MRR .630</text>
  <text x="138" y="692" font-size="11" fill="#52514e" text-anchor="end">−Soul Boost (fusion)</text>
  <rect x="160" y="681" width="517" height="9" fill="#94a3b8" opacity="0.9"/><text x="683" y="689" font-size="9" fill="#52514e">R@1 .805</text>
  <rect x="160" y="691" width="578" height="9" fill="#94a3b8" opacity="0.5"/><text x="744" y="699" font-size="9" fill="#52514e">MRR .900</text>
</svg>
