<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="OKS benchmark: 50-case ablation R@1 82.5% (fts5) vs 52.5% (native); LoCoMo 1540-case recall@1 92.0% vs OpenViking QA accuracy 82.86%; embedding 61.7% at 197× latency.">
  <rect x="150" y="4" width="14" height="14" rx="3" fill="#16a34a"/><text x="170" y="15" font-size="12" fill="#52514e">OKS fts5 (Node-BM25, default)</text>
  <rect x="330" y="4" width="14" height="14" rx="3" fill="#94a3b8"/><text x="350" y="15" font-size="12" fill="#52514e">ablated / other system</text>

  <text x="150" y="48" font-size="13" font-weight="600" fill="#0b0b0b">Retrieval ablation — 50-case semantic-paraphrase · R@1</text>
  <line x1="150.0" y1="62" x2="150.0" y2="215" stroke="#c3c2b7" stroke-width="1"/>
  <text x="150.0" y="231" font-size="10" fill="#898781" text-anchor="middle">0%</text>
  <line x1="312.5" y1="62" x2="312.5" y2="215" stroke="#e1e0d9" stroke-width="1"/>
  <text x="312.5" y="231" font-size="10" fill="#898781" text-anchor="middle">25%</text>
  <line x1="475.0" y1="62" x2="475.0" y2="215" stroke="#e1e0d9" stroke-width="1"/>
  <text x="475.0" y="231" font-size="10" fill="#898781" text-anchor="middle">50%</text>
  <line x1="637.5" y1="62" x2="637.5" y2="215" stroke="#e1e0d9" stroke-width="1"/>
  <text x="637.5" y="231" font-size="10" fill="#898781" text-anchor="middle">75%</text>
  <line x1="800.0" y1="62" x2="800.0" y2="215" stroke="#e1e0d9" stroke-width="1"/>
  <text x="800.0" y="231" font-size="10" fill="#898781" text-anchor="middle">100%</text>

  <text x="138" y="87" font-size="12" fill="#52514e" text-anchor="end">fts5 (Node-BM25)</text>
  <path d="M150,80 L150,62 L809,62 Q813,62 813,66 L813,76 Q813,80 809,80 Z" fill="#16a34a"/>
  <text x="820" y="75" font-size="11" font-weight="600" fill="#0b0b0b">82.5%</text>

  <text x="138" y="124" font-size="12" fill="#52514e" text-anchor="end">fusion (+native re-rank)</text>
  <path d="M150,117 L150,99 L790.6,99 Q794.6,99 794.6,103 L794.6,113 Q794.6,117 790.6,117 Z" fill="#94a3b8"/>
  <text x="801.6" y="112" font-size="11" fill="#52514e">80.5%</text>

  <text x="138" y="161" font-size="12" fill="#52514e" text-anchor="end">native (page-level 6+1)</text>
  <path d="M150,154 L150,136 L471.5,136 Q475.5,136 475.5,140 L475.5,150 Q475.5,154 471.5,154 Z" fill="#94a3b8"/>
  <text x="482.5" y="149" font-size="11" fill="#52514e">52.5%</text>

  <text x="150" y="267" font-size="13" font-weight="600" fill="#0b0b0b">LoCoMo long-conversation — 1540-case recall vs OpenViking QA accuracy</text>
  <line x1="150.0" y1="281" x2="150.0" y2="395" stroke="#c3c2b7" stroke-width="1"/>
  <text x="150.0" y="411" font-size="10" fill="#898781" text-anchor="middle">0%</text>
  <line x1="312.5" y1="281" x2="312.5" y2="395" stroke="#e1e0d9" stroke-width="1"/>
  <text x="312.5" y="411" font-size="10" fill="#898781" text-anchor="middle">25%</text>
  <line x1="475.0" y1="281" x2="475.0" y2="395" stroke="#e1e0d9" stroke-width="1"/>
  <text x="475.0" y="411" font-size="10" fill="#898781" text-anchor="middle">50%</text>
  <line x1="637.5" y1="281" x2="637.5" y2="395" stroke="#e1e0d9" stroke-width="1"/>
  <text x="637.5" y="411" font-size="10" fill="#898781" text-anchor="middle">75%</text>
  <line x1="800.0" y1="281" x2="800.0" y2="395" stroke="#e1e0d9" stroke-width="1"/>
  <text x="800.0" y="411" font-size="10" fill="#898781" text-anchor="middle">100%</text>

  <text x="138" y="306" font-size="12" fill="#52514e" text-anchor="end">OKS recall@1</text>
  <path d="M150,299 L150,281 L891.2,281 Q895.2,281 895.2,285 L895.2,295 Q895.2,299 891.2,299 Z" fill="#16a34a"/>
  <text x="820" y="294" font-size="11" font-weight="600" fill="#0b0b0b">92.0% · 31ms</text>

  <text x="138" y="343" font-size="12" fill="#52514e" text-anchor="end">OpenViking QA acc (best)</text>
  <path d="M150,336 L150,318 L805.2,318 Q809.2,318 809.2,322 L809.2,332 Q809.2,336 805.2,336 Z" fill="#2a78d6"/>
  <text x="820" y="331" font-size="11" fill="#52514e">82.86%</text>

  <text x="150" y="368" font-size="10" fill="#898781">Note: OKS = recall hit (recall upper-bounds QA); OpenViking = full QA (recall + LLM answer + judge). Not identical metrics.</text>

  <text x="150" y="448" font-size="13" font-weight="600" fill="#0b0b0b">Embedding vs literal — 50-case · R@1 and p50 latency</text>
  <line x1="150.0" y1="462" x2="150.0" y2="545" stroke="#c3c2b7" stroke-width="1"/>
  <text x="150.0" y="561" font-size="10" fill="#898781" text-anchor="middle">0%</text>
  <line x1="475.0" y1="462" x2="475.0" y2="545" stroke="#e1e0d9" stroke-width="1"/>
  <text x="475.0" y="561" font-size="10" fill="#898781" text-anchor="middle">50%</text>
  <line x1="800.0" y1="462" x2="800.0" y2="545" stroke="#e1e0d9" stroke-width="1"/>
  <text x="800.0" y="561" font-size="10" fill="#898781" text-anchor="middle">100%</text>

  <text x="138" y="487" font-size="12" fill="#52514e" text-anchor="end">fts5 (literal)</text>
  <path d="M150,480 L150,462 L809,462 Q813,462 813,466 L813,476 Q813,480 809,480 Z" fill="#16a34a"/>
  <text x="820" y="475" font-size="11" font-weight="600" fill="#0b0b0b">82.5% · 93ms</text>

  <text x="138" y="524" font-size="12" fill="#52514e" text-anchor="end">embedding (MiniLM)</text>
  <path d="M150,517 L150,499 L626.8,499 Q630.8,499 630.8,503 L630.8,513 Q630.8,517 626.8,517 Z" fill="#94a3b8"/>
  <text x="637.8" y="512" font-size="11" fill="#52514e">61.7% · 18304ms (197×)</text>
</svg>
