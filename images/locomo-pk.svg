<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="LoCoMo 1540-case. OKS recall@1=0.920 p50=31ms; OpenViking QA accuracy=0.8286 (Hermes best).">
  <style>
    .bg{fill:#fafaf7}.tx{fill:#0b0b0b}.mu{fill:#52514e}.gr{fill:#c3c2b7}.gl{fill:#e1e0d9}
    .bar{fill:#16a34a}.ov{fill:#2a78d6}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.tx{fill:#e6edf3}.mu{fill:#8b949e}.gr{fill:#30363d}.gl{fill:#21262d}
      .bar{fill:#22c55e}.ov{fill:#4a90e8}
    }
  </style>
  <rect class="bg" width="620" height="180"/>
  <text x="10" y="18" font-size="13" font-weight="600" class="tx">LoCoMo long-conversation — 1540-case · OKS recall@1 vs OpenViking QA accuracy</text>
  <rect x="10" y="30" width="12" height="12" rx="2" class="bar"/><text x="26" y="40" font-size="11" class="mu">OKS (recall hit, API-free)</text>
  <rect x="200" y="30" width="12" height="12" rx="2" class="ov"/><text x="216" y="40" font-size="11" class="mu">OpenViking (full QA, best Hermes)</text>
  <line x1="150" y1="55" x2="150" y2="140" class="gr" stroke-width="1"/>
  <line x1="255" y1="55" x2="255" y2="140" class="gl" stroke-width="1"/>
  <line x1="360" y1="55" x2="360" y2="140" class="gl" stroke-width="1"/>
  <line x1="465" y1="55" x2="465" y2="140" class="gl" stroke-width="1"/>
  <line x1="570" y1="55" x2="570" y2="140" class="gl" stroke-width="1"/>
  <text x="150" y="155" font-size="10" class="mu" text-anchor="middle">0</text>
  <text x="255" y="155" font-size="10" class="mu" text-anchor="middle">.25</text>
  <text x="360" y="155" font-size="10" class="mu" text-anchor="middle">.50</text>
  <text x="465" y="155" font-size="10" class="mu" text-anchor="middle">.75</text>
  <text x="570" y="155" font-size="10" class="mu" text-anchor="middle">1.0</text>
  <text x="142" y="80" font-size="12" class="mu" text-anchor="end">OKS recall@1</text>
  <rect x="152" y="68" width="391" height="16" rx="3" class="bar"/><text x="549" y="80" font-size="11" font-weight="600" class="tx">.920 · 31ms</text>
  <text x="142" y="116" font-size="12" class="mu" text-anchor="end">OpenViking QA</text>
  <rect x="152" y="104" width="352" height="16" rx="3" class="ov"/><text x="510" y="116" font-size="11" class="mu">.8286</text>
  <text x="10" y="174" font-size="10" class="mu">Note: OKS = recall hit (upper-bounds QA); OpenViking = full QA (recall + LLM answer + judge). Not identical metrics.</text>
</svg>
