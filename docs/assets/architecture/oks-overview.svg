<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
  <title id="title">Open Knowledge Studio（OKS）当前架构</title>
  <desc id="desc">三段式 OKS 架构图：来源经过能力选择、证据片段、清单和 raw-commit，进入 Raw Bundle、Candidate、人工审核和 Wiki；文件工作区由 profiles、raw、drafts、wiki、mail 五个桶以及 settings、_meta、security 和 Trace 组成；召回引擎按六加一因素把已审核知识注入下一次任务，飞书和 Office 是可选入口与交付能力。</desc>
  <defs>
    <style>
      .title{fill:#17233b;font:700 32px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.subtitle{fill:#64748b;font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.lane-title{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.lane-note{fill:#64748b;font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.node-title{fill:#17233b;font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.node-body{fill:#5b6b82;font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.bucket-title{fill:#17233b;font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.bucket-body{fill:#5b6b82;font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.label{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.2px}.edge-label{fill:#52627a;font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.guard{fill:#dbeafe;font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
  </defs>
  <rect width="1600" height="1240" rx="28" fill="#f8fafc"/>
  <text x="56" y="56" class="title">Open Knowledge Studio（OKS）当前架构</text>
  <text x="56" y="86" class="subtitle">Agent-native · 文件系统优先 · 可审核 · 可追溯的个人知识工作台</text>
  <rect x="56" y="104" width="720" height="30" rx="15" fill="#eaf2ff"/>
  <text x="72" y="124" fill="#1d4ed8" class="label">用户提出目标，Agent 编排能力；人保留审核、投递和对外决策权</text>

  <rect x="40" y="150" width="1520" height="220" rx="20" fill="#f4f8ff" stroke="#c7dcff" stroke-width="2"/>
  <text x="64" y="184" class="lane-title" fill="#2563eb">01 摄入流水线</text><text x="250" y="184" class="lane-note">来源不会直接变成结论：每一步都保留状态、来源和证据边界</text>
  <rect x="58" y="208" width="140" height="124" rx="12" fill="#fff" stroke="#6ea1ff" stroke-width="2"/><text x="78" y="238" class="node-title">Source</text><text x="78" y="264" class="node-body">文件 / URL</text><text x="78" y="284" class="node-body">媒体 / 平台</text>
  <path d="M198 270H208" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="208" y="208" width="140" height="124" rx="12" fill="#fff" stroke="#6ea1ff" stroke-width="2"/><text x="228" y="238" class="node-title">模态判断</text><text x="228" y="264" class="node-body">text / pdf / office</text><text x="228" y="284" class="node-body">image / web / AV</text>
  <path d="M348 270H358" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="358" y="208" width="140" height="124" rx="12" fill="#fff" stroke="#6ea1ff" stroke-width="2"/><text x="378" y="238" class="node-title">Provider</text><text x="378" y="264" class="node-body">按可用能力选择</text><text x="378" y="284" class="node-body">状态如实保留</text>
  <path d="M498 270H508" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="508" y="208" width="140" height="124" rx="12" fill="#fff" stroke="#6ea1ff" stroke-width="2"/><text x="528" y="238" class="node-title">EvidenceFragment</text><text x="528" y="264" class="node-body">证据片段</text><text x="528" y="284" class="node-body">提取结果可回源</text>
  <path d="M648 270H658" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="658" y="208" width="140" height="124" rx="12" fill="#fff" stroke="#6ea1ff" stroke-width="2"/><text x="678" y="238" class="node-title">Manifest</text><text x="678" y="264" class="node-body">步骤 / artifacts</text><text x="678" y="284" class="node-body">hash / provenance</text>
  <path d="M798 270H808" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="808" y="208" width="140" height="124" rx="12" fill="#edf4ff" stroke="#2563eb" stroke-width="2"/><text x="828" y="238" class="node-title">raw-commit</text><text x="828" y="264" class="node-body">fail-closed</text><text x="828" y="284" class="node-body">schema 校验</text>
  <path d="M948 270H958" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="958" y="208" width="140" height="124" rx="12" fill="#edf4ff" stroke="#2563eb" stroke-width="2"/><text x="978" y="238" class="node-title">Raw Bundle</text><text x="978" y="264" class="node-body">v0.2</text><text x="978" y="284" class="node-body">bundle / source</text>
  <path d="M1098 270H1108" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1108" y="208" width="140" height="124" rx="12" fill="#fff8ef" stroke="#f59e0b" stroke-width="2"/><text x="1128" y="238" class="node-title">Candidate</text><text x="1128" y="264" class="node-body">A / B / C</text><text x="1128" y="284" class="node-body">Agent 提议，待人审</text>
  <path d="M1248 270H1258" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1258" y="208" width="140" height="124" rx="12" fill="#fff8ef" stroke="#f59e0b" stroke-width="2"/><text x="1278" y="238" class="node-title">Human Review</text><text x="1278" y="264" class="node-body">accept / edit</text><text x="1278" y="284" class="node-body">reject / 回执</text>
  <path d="M1398 270H1408" stroke="#16a34a" stroke-width="3" marker-end="url(#green-arrow)"/>
  <rect x="1408" y="208" width="140" height="124" rx="12" fill="#effaf2" stroke="#16a34a" stroke-width="2"/><text x="1428" y="238" class="node-title">Wiki</text><text x="1428" y="264" class="node-body">正式知识</text><text x="1428" y="284" class="node-body">可被后续召回</text>

  <rect x="40" y="398" width="1060" height="426" rx="20" fill="#f5fbf6" stroke="#bfe5c8" stroke-width="2"/>
  <text x="64" y="432" class="lane-title" fill="#15803d">02 文件工作区</text><text x="270" y="432" class="lane-note">5 个认知 / 交互桶 + 基础设施；raw ≠ memory</text>
  <rect x="64" y="456" width="190" height="148" rx="14" fill="#eef4ff" stroke="#79a8ff" stroke-width="2"/><text x="84" y="488" class="label" fill="#2563eb">稳定上下文</text><text x="84" y="520" class="bucket-title">profiles/</text><text x="84" y="548" class="bucket-body">users · projects ·</text><text x="84" y="568" class="bucket-body">recipes · goals</text>
  <rect x="264" y="456" width="190" height="148" rx="14" fill="#effaf2" stroke="#65c981" stroke-width="2"/><text x="284" y="488" class="label" fill="#15803d">来源与证据</text><text x="284" y="520" class="bucket-title">raw/</text><text x="284" y="548" class="bucket-body">原文与机械提取</text><text x="284" y="568" class="bucket-body">按日期归档，可回源</text>
  <rect x="464" y="456" width="190" height="148" rx="14" fill="#fff8ef" stroke="#f2b35e" stroke-width="2"/><text x="484" y="488" class="label" fill="#c2410c">Agent 的提议</text><text x="484" y="520" class="bucket-title">drafts/</text><text x="484" y="548" class="bucket-body">Candidate / 蒸馏草稿</text><text x="484" y="568" class="bucket-body">未人审，不进长期知识</text>
  <rect x="664" y="456" width="190" height="148" rx="14" fill="#f3efff" stroke="#a78bfa" stroke-width="2"/><text x="684" y="488" class="label" fill="#7e22ce">经人审核</text><text x="684" y="520" class="bucket-title">wiki/</text><text x="684" y="548" class="bucket-body">概念 · 策略 · 反模式</text><text x="684" y="568" class="bucket-body">可复用，带状态标签</text>
  <rect x="864" y="456" width="190" height="148" rx="14" fill="#f8fafc" stroke="#b7c2d2" stroke-width="2"/><text x="884" y="488" class="label" fill="#475569">协作反馈</text><text x="884" y="520" class="bucket-title">mail/</text><text x="884" y="548" class="bucket-body">inbox / sent</text><text x="884" y="568" class="bucket-body">不冒充长期知识</text>
  <path d="M64 628H1054" stroke="#9dc9a7" stroke-width="2" stroke-dasharray="6 7"/><text x="82" y="654" class="label" fill="#15803d">基础设施与可追溯性</text>
  <rect x="64" y="674" width="310" height="112" rx="14" fill="#fff" stroke="#b7c2d2" stroke-width="2"/><text x="84" y="707" class="bucket-title">settings/</text><text x="84" y="734" class="bucket-body">recall.yaml · hooks · 默认策略</text><text x="84" y="756" class="bucket-body">配置影响行为，不改变证据</text>
  <rect x="394" y="674" width="310" height="112" rx="14" fill="#fff" stroke="#b7c2d2" stroke-width="2"/><text x="414" y="707" class="bucket-title">_meta/ · security</text><text x="414" y="734" class="bucket-body">Schema、脱敏、敏感字段检测</text><text x="414" y="756" class="bucket-body">VFS 只读视图，不新增知识</text>
  <rect x="724" y="674" width="330" height="112" rx="14" fill="#fff" stroke="#b7c2d2" stroke-width="2"/><text x="744" y="707" class="bucket-title">Trace</text><text x="744" y="734" class="bucket-body">执行、评判、阻塞与反馈记录</text><text x="744" y="756" class="bucket-body">可追溯，但不回灌为知识</text>

  <rect x="1130" y="398" width="430" height="426" rx="20" fill="#fff" stroke="#d9e2ef" stroke-width="2"/>
  <text x="1154" y="432" class="lane-title" fill="#475569">运行时与可选能力</text><text x="1154" y="456" class="lane-note">核心 CLI 不调用 AI API；Agent 负责编排</text>
  <rect x="1154" y="478" width="382" height="78" rx="12" fill="#edf4ff" stroke="#79a8ff" stroke-width="2"/><text x="1174" y="508" class="label" fill="#2563eb">核心运行时</text><text x="1174" y="534" class="node-title">oks CLI：文件操作 · 状态 · recall · trace</text>
  <rect x="1154" y="568" width="382" height="82" rx="12" fill="#effaf2" stroke="#65c981" stroke-width="2"/><text x="1174" y="598" class="label" fill="#15803d">能力选择</text><text x="1174" y="624" class="node-title">Recipe + Provider / Capability</text><text x="1174" y="644" class="node-body">网页、PDF、Office、图片、音视频</text>
  <rect x="1154" y="662" width="382" height="70" rx="12" fill="#fff8ef" stroke="#f2b35e" stroke-width="2"/><text x="1174" y="690" class="label" fill="#c2410c">明确要求交付时</text><text x="1174" y="716" class="node-title">Office：Word / PDF / PPT / Excel → 渲染检查</text>
  <rect x="1154" y="744" width="382" height="58" rx="12" fill="#fbf5ff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 5"/><text x="1174" y="770" class="label" fill="#7e22ce">可选参考实现 · 飞书</text><text x="1174" y="792" class="node-body">Base / 表单 / IM：采集与移动审核入口</text>

  <path d="M1028 370V434H359V456" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#green-arrow)"/><text x="770" y="422" class="edge-label">保存来源与提取结果 → raw/</text>
  <path d="M1180 370V390" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="1192" y="388" class="edge-label">能力由 Agent 选择</text>

  <rect x="40" y="850" width="1520" height="250" rx="20" fill="#fff9f1" stroke="#f4c98e" stroke-width="2"/>
  <text x="64" y="884" class="lane-title" fill="#c2410c">03 召回 + 注入</text><text x="252" y="884" class="lane-note">只把已审核知识和必要的来源带回下一次任务；相关性不等于真实性</text>
  <rect x="64" y="914" width="220" height="96" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="84" y="948" class="node-title">Query</text><text x="84" y="976" class="node-body">用户 prompt / 工具操作</text>
  <path d="M284 962H296" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="296" y="914" width="220" height="96" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="316" y="948" class="node-title">scope / goal</text><text x="316" y="976" class="node-body">registry 约束范围</text>
  <path d="M516 962H528" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="528" y="914" width="220" height="96" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="548" y="948" class="node-title">6+1 因子评分</text><text x="548" y="976" class="node-body">overlap · topic · review</text><text x="548" y="994" class="node-body">recency · curve · goal</text>
  <path d="M748 962H760" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="760" y="914" width="220" height="96" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="780" y="948" class="node-title">search backend</text><text x="780" y="976" class="node-body">native / FTS5 / fusion</text>
  <path d="M980 962H992" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="992" y="914" width="220" height="96" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="1012" y="948" class="node-title">过滤 + 去重</text><text x="1012" y="976" class="node-body">floor · cooldown</text>
  <path d="M1212 962H1224" stroke="#ea580c" stroke-width="3" marker-end="url(#orange-arrow)"/>
  <rect x="1224" y="914" width="312" height="96" rx="12" fill="#fff1e8" stroke="#ea580c" stroke-width="2"/><text x="1244" y="948" class="node-title">注入上文</text><text x="1244" y="976" class="node-body">&lt;recalled-memory&gt; → Agent 继续任务</text>
  <rect x="64" y="1030" width="470" height="42" rx="12" fill="#fff" stroke="#cbd5e1" stroke-dasharray="6 5"/><text x="84" y="1056" class="node-body">UserPromptSubmit：自动召回并注入</text>
  <rect x="548" y="1030" width="470" height="42" rx="12" fill="#fff" stroke="#cbd5e1" stroke-dasharray="6 5"/><text x="568" y="1056" class="node-body">PostToolUse：冲突检测 → mail/ 反馈</text>
  <rect x="1032" y="1030" width="504" height="42" rx="12" fill="#fff" stroke="#cbd5e1" stroke-dasharray="6 5"/><text x="1052" y="1056" class="node-body">[verified] 只来自 Trace 证据或 human_reviewed_at</text>

  <rect x="40" y="1130" width="1520" height="70" rx="16" fill="#17233b"/><text x="64" y="1160" fill="#fff" class="label">不跨越的边界</text><text x="220" y="1160" class="guard">Raw ≠ 结论</text><text x="410" y="1160" class="guard">Candidate ≠ 长期知识</text><text x="700" y="1160" class="guard">相关性 ≠ 真实性</text><text x="980" y="1160" class="guard">自动化 ≠ 代替人的决定</text><text x="64" y="1184" class="guard">飞书是可选入口，Office 是明确交付时的能力；两者都不能绕过人工审核。</text>
</svg>
