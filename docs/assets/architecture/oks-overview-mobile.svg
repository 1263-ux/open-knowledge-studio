<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 2470" role="img" aria-labelledby="title desc">
  <title id="title">Open Knowledge Studio（OKS）当前架构，手机端</title>
  <desc id="desc">手机端垂直架构图，依次展示摄入流水线、五个文件桶与基础设施、运行时和可选入口、召回与注入。</desc>
  <defs><style>.title{fill:#17233b;font:700 23px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.sub{fill:#64748b;font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.lane{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.note{fill:#64748b;font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.head{fill:#17233b;font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.body{fill:#5b6b82;font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.edge{fill:#52627a;font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker></defs>
  <rect width="420" height="2470" rx="22" fill="#f8fafc"/><text x="24" y="42" class="title">OKS 当前架构</text><text x="24" y="66" class="sub">Agent 编排，人审核；文件化知识在下一次任务复用。</text>
  <rect x="18" y="88" width="384" height="928" rx="16" fill="#f4f8ff" stroke="#c7dcff" stroke-width="2"/><text x="38" y="118" class="lane" fill="#2563eb">01 摄入流水线</text><text x="38" y="140" class="note">来源 → 证据 → Raw → Candidate → Wiki</text>
  <rect x="38" y="164" width="344" height="88" rx="12" fill="#fff" stroke="#6ea1ff" stroke-width="2"/><text x="56" y="195" class="head">Source + 模态判断</text><text x="56" y="220" class="body">文件、URL、媒体；判断 text / PDF / Office / Web / AV</text><path d="M210 252V270" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="38" y="278" width="344" height="88" rx="12" fill="#fff" stroke="#6ea1ff" stroke-width="2"/><text x="56" y="309" class="head">Provider → EvidenceFragment</text><text x="56" y="334" class="body">按可用能力提取；片段可回到原始来源</text><path d="M210 366V384" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="38" y="392" width="344" height="88" rx="12" fill="#fff" stroke="#6ea1ff" stroke-width="2"/><text x="56" y="423" class="head">Manifest → raw-commit</text><text x="56" y="448" class="body">记录步骤、artifacts、hash 和 provenance；失败则停下</text><path d="M210 480V498" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="38" y="506" width="344" height="88" rx="12" fill="#edf4ff" stroke="#2563eb" stroke-width="2"/><text x="56" y="537" class="head">Raw Bundle v0.2</text><text x="56" y="562" class="body">原始材料和机械提取结果，保存来源，不等于结论</text><path d="M210 594V612" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="38" y="620" width="344" height="88" rx="12" fill="#fff8ef" stroke="#f59e0b" stroke-width="2"/><text x="56" y="651" class="head">Candidate</text><text x="56" y="676" class="body">Agent 提出 A / B / C；进入人审前不能成为长期知识</text><path d="M210 708V726" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="38" y="734" width="344" height="88" rx="12" fill="#fff8ef" stroke="#f59e0b" stroke-width="2"/><text x="56" y="765" class="head">Human Review</text><text x="56" y="790" class="body">accept / edit / reject；保留人工决定和回执</text><path d="M210 822V840" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <rect x="38" y="848" width="344" height="88" rx="12" fill="#effaf2" stroke="#16a34a" stroke-width="2"/><text x="56" y="879" class="head">Wiki</text><text x="56" y="904" class="body">正式、可复用知识；带状态标签，可被召回</text><text x="38" y="972" class="edge">每一步都保留状态和证据边界</text>

  <rect x="18" y="1040" width="384" height="650" rx="16" fill="#f5fbf6" stroke="#bfe5c8" stroke-width="2"/><text x="38" y="1070" class="lane" fill="#15803d">02 文件工作区</text><text x="38" y="1092" class="note">5 个桶 + 基础设施，各自有不同信任边界</text>
  <rect x="38" y="1118" width="344" height="78" rx="12" fill="#eef4ff" stroke="#79a8ff" stroke-width="2"/><text x="56" y="1148" class="head">profiles/</text><text x="56" y="1172" class="body">用户、项目、Recipe、Goal；稳定上下文</text>
  <rect x="38" y="1210" width="344" height="78" rx="12" fill="#effaf2" stroke="#65c981" stroke-width="2"/><text x="56" y="1240" class="head">raw/</text><text x="56" y="1264" class="body">原始来源和机械提取；可回源</text>
  <rect x="38" y="1302" width="344" height="78" rx="12" fill="#fff8ef" stroke="#f2b35e" stroke-width="2"/><text x="56" y="1332" class="head">drafts/</text><text x="56" y="1356" class="body">Candidate 和草稿；未人审不进入 Wiki</text>
  <rect x="38" y="1394" width="344" height="78" rx="12" fill="#f3efff" stroke="#a78bfa" stroke-width="2"/><text x="56" y="1424" class="head">wiki/</text><text x="56" y="1448" class="body">人审后的概念、策略和反模式</text>
  <rect x="38" y="1486" width="344" height="78" rx="12" fill="#f8fafc" stroke="#b7c2d2" stroke-width="2"/><text x="56" y="1516" class="head">mail/</text><text x="56" y="1540" class="body">协作反馈；不冒充长期知识</text>
  <rect x="38" y="1578" width="344" height="84" rx="12" fill="#fff" stroke="#b7c2d2" stroke-width="2"/><text x="56" y="1608" class="head">settings · _meta · security · Trace</text><text x="56" y="1632" class="body">配置、Schema、脱敏、执行证据；不回灌为知识</text>

  <rect x="18" y="1714" width="384" height="356" rx="16" fill="#fff" stroke="#d9e2ef" stroke-width="2"/><text x="38" y="1744" class="lane" fill="#475569">运行时与可选能力</text><rect x="38" y="1770" width="344" height="66" rx="12" fill="#edf4ff" stroke="#79a8ff" stroke-width="2"/><text x="56" y="1798" class="head">oks CLI（API-free）</text><text x="56" y="1820" class="body">文件操作、状态、recall、trace</text><rect x="38" y="1850" width="344" height="70" rx="12" fill="#effaf2" stroke="#65c981" stroke-width="2"/><text x="56" y="1878" class="head">Recipe + Provider / Capability</text><text x="56" y="1902" class="body">网页、PDF、Office、图片、音视频</text><rect x="38" y="1934" width="344" height="58" rx="12" fill="#fff8ef" stroke="#f2b35e" stroke-width="2"/><text x="56" y="1960" class="head">Office：明确交付时启用</text><text x="56" y="1980" class="body">Word / PDF / PPT / Excel → 渲染检查</text><rect x="38" y="2006" width="344" height="46" rx="12" fill="#fbf5ff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 5"/><text x="56" y="2034" class="head">飞书：可选采集 / 移动审核入口</text>

  <rect x="18" y="2094" width="384" height="294" rx="16" fill="#fff9f1" stroke="#f4c98e" stroke-width="2"/><text x="38" y="2124" class="lane" fill="#c2410c">03 召回 + 注入</text><text x="38" y="2146" class="note">只带回已审核知识和必要来源</text><rect x="38" y="2170" width="344" height="44" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="56" y="2198" class="head">Query → scope / goal</text><path d="M210 2214V2228" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/><rect x="38" y="2234" width="344" height="44" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="56" y="2262" class="head">6+1 评分 → search backend</text><path d="M210 2278V2292" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/><rect x="38" y="2298" width="344" height="44" rx="10" fill="#fff1e8" stroke="#ea580c" stroke-width="2"/><text x="56" y="2326" class="head">过滤去重 → 注入 Agent 上文</text><text x="38" y="2368" class="body">UserPromptSubmit 自动召回；PostToolUse 做冲突检测并写入 mail/。</text>
  <rect x="18" y="2410" width="384" height="42" rx="12" fill="#17233b"/><text x="38" y="2437" class="body" fill="#dbeafe">Raw ≠ 结论 · Candidate ≠ 长期知识 · 自动化 ≠ 代替人的决定</text>
</svg>
