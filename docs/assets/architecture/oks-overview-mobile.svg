<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1700" role="img" aria-labelledby="title desc">
  <title id="title">Open Knowledge Studio 完整工作架构，手机端</title>
  <desc id="desc">用户与 Agent、知识工作区、运行时能力和交付关系的垂直架构图。</desc>
  <defs>
    <style>
      .title{fill:#10213d;font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.sub{fill:#607087;font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.zone{fill:#344767;font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.tag{fill:#2563eb;font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.head{fill:#13233d;font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.body{fill:#53647c;font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.edge{fill:#516178;font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#91a0b8"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="420" height="1700" rx="20" fill="#f6f8fc"/>
  <text x="26" y="44" class="title">OKS 完整工作架构</text>
  <text x="26" y="68" class="sub">Agent 编排，人审核；文件化知识能在下一次任务复用。</text>

  <rect x="22" y="94" width="376" height="184" rx="16" fill="#fff" stroke="#d9e2ef" stroke-width="2"/>
  <text x="42" y="124" class="zone">任务面：用户与 Agent</text>
  <rect x="42" y="144" width="336" height="48" rx="10" fill="#eef4ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="58" y="173" class="head">用户：任务、来源、目标与审核</text>
  <path d="M210 194v20" fill="none" stroke="#91a0b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="42" y="224" width="336" height="36" rx="10" fill="#eef8ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="58" y="248" class="body">Agent：选择能力、提出 Candidate、说明依据与缺口</text>

  <path d="M210 278v30" fill="none" stroke="#91a0b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="22" y="326" width="376" height="754" rx="16" fill="#fff" stroke="#d9e2ef" stroke-width="2"/>
  <text x="42" y="356" class="zone">知识工作区（文件 + Git）</text>
  <text x="42" y="378" class="sub">每个桶都有自己的信任与召回边界。</text>

  <rect x="42" y="404" width="336" height="104" rx="12" fill="#eef4ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="58" y="430" class="tag">稳定上下文</text><text x="58" y="458" class="head">profiles/</text><text x="58" y="482" class="body">用户、项目、Recipe、Goal；Goal 只影响相关性。</text>
  <rect x="42" y="530" width="336" height="104" rx="12" fill="#effaf2" stroke="#86efac" stroke-width="2"/>
  <text x="58" y="556" class="tag">来源与证据</text><text x="58" y="584" class="head">raw/</text><text x="58" y="608" class="body">原文、转换结果与对话；材料不是结论。</text>
  <path d="M210 634v24" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="42" y="678" width="336" height="112" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="58" y="704" class="tag">Agent 的提议</text><text x="58" y="732" class="head">drafts/</text><text x="58" y="756" class="body">Candidate 与蒸馏草稿；没有人审，不能进入长期知识。</text>
  <path d="M210 790v24" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#green)"/>
  <text x="226" y="810" class="edge">人审</text>
  <rect x="42" y="834" width="336" height="112" rx="12" fill="#f3efff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="58" y="860" class="tag">经人审核</text><text x="58" y="888" class="head">wiki/</text><text x="58" y="912" class="body">可复用知识；按相关性、Goal 与记忆曲线召回。</text>
  <rect x="42" y="968" width="162" height="86" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="58" y="994" class="tag">协作证据</text><text x="58" y="1022" class="head">mail/</text><text x="58" y="1044" class="body">不属于长期知识</text>
  <rect x="216" y="968" width="162" height="86" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="232" y="994" class="tag">执行轨迹</text><text x="232" y="1022" class="head">Trace</text><text x="232" y="1044" class="body">可追溯，不回灌</text>

  <path d="M210 1080v30" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="22" y="1128" width="376" height="422" rx="16" fill="#fff" stroke="#d9e2ef" stroke-width="2"/>
  <text x="42" y="1158" class="zone">OKS 运行时与能力层</text>
  <rect x="42" y="1180" width="336" height="84" rx="12" fill="#eef4ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="58" y="1207" class="tag">核心 CLI（API-free）</text><text x="58" y="1235" class="head">oks：文件操作、召回与状态</text><text x="58" y="1255" class="body">raw-commit · drafts · wiki · recall · trace</text>
  <rect x="42" y="1282" width="336" height="92" rx="12" fill="#effaf2" stroke="#86efac" stroke-width="2"/>
  <text x="58" y="1309" class="tag">能力选择与收录</text><text x="58" y="1337" class="head">Recipe + Provider / Capability</text><text x="58" y="1359" class="body">网页、PDF、Office、图像、音频、视频等。</text>
  <rect x="42" y="1392" width="336" height="74" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="58" y="1419" class="tag">安全、契约与入口</text><text x="58" y="1447" class="body">settings · schema · security · Hooks · 只读 VFS</text>
  <rect x="42" y="1482" width="336" height="48" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="58" y="1513" class="body">明确要求交付时：Office → Word / PDF / PPT / Excel</text>

  <rect x="22" y="1580" width="376" height="92" rx="14" fill="#10213d"/>
  <text x="42" y="1614" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700">不跨越：</text>
  <text x="42" y="1640" fill="#dbeafe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">Raw ≠ 结论 · Candidate ≠ 长期知识</text>
  <text x="42" y="1662" fill="#dbeafe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">相关性 ≠ 真实性 · 自动化 ≠ 代替人的决定</text>
</svg>
