<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">OKS knowledge loop</title>
  <desc id="desc">Raw material becomes a candidate, is reviewed by a human, becomes Wiki knowledge, and is recalled into an Agent conversation.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#f8fafc"/>
  <text x="54" y="48" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#0f172a">从资料到可召回知识</text>
  <text x="54" y="76" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#64748b">OKS 保留来源，Agent 生成候选，人决定什么值得长期保存。</text>

  <g filter="url(#shadow)">
    <rect x="54" y="122" width="190" height="112" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="274" y="122" width="190" height="112" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="494" y="122" width="190" height="112" rx="16" fill="#ffffff" stroke="#fde68a"/>
    <rect x="714" y="122" width="190" height="112" rx="16" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="934" y="122" width="212" height="112" rx="16" fill="#ffffff" stroke="#ddd6fe"/>
  </g>

  <g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif">
    <text x="78" y="153" font-size="13" font-weight="700" fill="#64748b">01 · RAW</text>
    <text x="78" y="183" font-size="18" font-weight="700" fill="#0f172a">原始资料</text>
    <text x="78" y="208" font-size="13" fill="#475569">文章 · 视频 · 对话</text>

    <text x="298" y="153" font-size="13" font-weight="700" fill="#2563eb">02 · CANDIDATE</text>
    <text x="298" y="183" font-size="18" font-weight="700" fill="#0f172a">候选知识</text>
    <text x="298" y="208" font-size="13" fill="#475569">提炼观点，保留来源</text>

    <text x="518" y="153" font-size="13" font-weight="700" fill="#b45309">03 · REVIEW</text>
    <text x="518" y="183" font-size="18" font-weight="700" fill="#0f172a">人工审核</text>
    <text x="518" y="208" font-size="13" fill="#475569">确认事实与复用价值</text>

    <text x="738" y="153" font-size="13" font-weight="700" fill="#15803d">04 · WIKI</text>
    <text x="738" y="183" font-size="18" font-weight="700" fill="#0f172a">长期知识</text>
    <text x="738" y="208" font-size="13" fill="#475569">可维护，可追溯，可衰减</text>

    <text x="958" y="153" font-size="13" font-weight="700" fill="#6d28d9">05 · RECALL</text>
    <text x="958" y="183" font-size="18" font-weight="700" fill="#0f172a">注入对话</text>
    <text x="958" y="208" font-size="13" fill="#475569">需要时回到 Agent 上下文</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="244" y1="178" x2="266" y2="178"/>
    <line x1="464" y1="178" x2="486" y2="178"/>
    <line x1="684" y1="178" x2="706" y2="178"/>
    <line x1="904" y1="178" x2="926" y2="178"/>
  </g>
</svg>
