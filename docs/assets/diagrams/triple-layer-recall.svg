<text x="595" y="95" text-anchor="middle" fill="#64748b" font-size="11">importance×e^(-λt)</text>
<text x="595" y="111" text-anchor="middle" fill="#64748b" font-size="11">+ln(1+access)</text>
<text x="595" y="127" text-anchor="middle" fill="#64748b" font-size="11">决定&quot;多旧还值得出现&quot;</text>
