<text x="95" y="95" text-anchor="middle" fill="#64748b" font-size="11">SQLite FTS5</text>
<text x="95" y="111" text-anchor="middle" fill="#64748b" font-size="11">## 标题节点索引</text>
<text x="95" y="127" text-anchor="middle" fill="#64748b" font-size="11">决定&quot;哪些命中&quot;</text>
