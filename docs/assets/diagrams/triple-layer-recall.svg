<text x="345" y="75" text-anchor="middle" fill="#0f172a" font-size="14.5" font-weight="700">Soul Boost 注入层</text>
<text x="345" y="95" text-anchor="middle" fill="#64748b" font-size="11">type boost</text>
<text x="345" y="111" text-anchor="middle" fill="#64748b" font-size="11">review bonus</text>
<text x="345" y="127" text-anchor="middle" fill="#64748b" font-size="11">决定&quot;哪些到达 Agent&quot;</text>
<line x1="422" y1="82" x2="516" y2="82" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
