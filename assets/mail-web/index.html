<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OKS Mail · 让对话继续</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="layout.css"><script src="app.js" defer></script></head><body>
<div class="demo"><span><b>交互原型</b> · 所有消息、回执与设备状态均为演示，不会发送给真实 Agent</span><button id="labToggle">体验不同场景</button></div>
<div id="lab" hidden><label>场景 <select id="scenario"><option value="normal">正常通信</option><option value="offline">另一台设备离线</option><option value="conflict">同步遇到冲突</option><option value="failure">下一次发送失败</option><option value="empty">空白邮箱</option><option value="loading">加载中</option></select></label><button id="reset">重置演示</button><span>演示会保存在此浏览器；重置只清除此原型的数据。</span></div>
<div class="shell">
<nav class="rail" aria-label="Mail 导航"><a class="logo" href="/" aria-label="OKS Mail 首页"><span class="mark">m</span><span>OKS <strong>Mail</strong></span></a><div class="workspace"><span class="workspace-icon">O</span><div><b>我的协作空间</b><small>对话在这里延续</small></div></div><button id="new" class="primary">＋ 新建对话</button><div class="nav-label">我的消息</div><button class="nav-item active" data-filter="all">全部对话 <span id="total"></span></button><button class="nav-item" data-filter="unread">未读消息 <span id="unread"></span></button><button class="nav-item" data-filter="archived">已归档</button><div class="nav-label">与我协作</div><button class="contact" data-person="claude"><span class="avatar clay">C</span><span>Claude<small>讨论与分析</small></span></button><button class="contact" data-person="codex"><span class="avatar mint">↗</span><span>Codex<small>代码与审查</small></span></button><button class="contact" data-person="other"><span class="avatar muted">＋</span><span>其他助手<small>查看接入方式</small></span></button><div class="rail-bottom"><button id="help">ⓘ 通信是怎样发生的</button><button id="theme">◐ 切换深色外观</button><div class="identity"><span class="avatar ink">你</span><span><b>你</b><small>此设备 · 本地身份</small></span></div></div></nav>
<section class="inbox" aria-label="对话列表"><header><div><span class="eyebrow">我的消息</span><h1 id="listTitle">全部对话</h1></div><button id="mobileNew" aria-label="新建对话">＋</button></header><label class="search"><span>⌕</span><input id="search" placeholder="搜索对话或参与者" aria-label="搜索对话或参与者"></label><div class="mobile-filters"><button data-filter="all">全部</button><button data-filter="unread">未读</button><button data-filter="archived">归档</button><button id="mobileHelp">说明</button><button id="mobileTheme">◐</button></div><div id="threadList"></div><footer><span class="status-dot"></span> <span id="syncLabel">演示消息保存在此浏览器</span><button id="syncInfo" aria-label="查看保存与同步说明">ⓘ</button></footer></section>
<main id="conversation"><header class="conversation-head"><button id="back" aria-label="返回对话列表">←</button><div class="head-text"><div id="participants" class="eyebrow"></div><h2 id="subject"></h2></div><button id="archive">归档</button><button id="details" aria-expanded="false">对话详情 ⓘ</button></header><div id="banner" hidden></div><div id="messages" aria-label="对话消息"></div><form id="replyForm"><div class="compose-meta"><span>以 <b>你（此设备）</b> 的身份回复</span><span id="replyTo"></span></div><label class="sr-only" for="reply">回复这段对话</label><textarea id="reply" rows="3" placeholder="继续这段对话…"></textarea><div id="replyError" class="error" role="alert"></div><div class="compose-actions"><span>回复会留在同一段对话里</span><button id="send" class="primary" type="submit">发送回复 ↑</button></div></form><p class="footnote">换个会话，换台设备，对话仍可继续。接收情况以实际回执为准。</p></main>
<aside id="detailPanel" hidden aria-label="对话详情"><header><h3>对话详情</h3><button id="closeDetails" aria-label="关闭对话详情">×</button></header><div id="detailContent"></div></aside>
</div>
<dialog id="composeDialog"><form id="newForm"><header><div><span class="eyebrow">START A CONVERSATION</span><h2>开始一段新对话</h2></div><button type="button" data-close aria-label="关闭新建对话">×</button></header><p class="muted-text">选一位协作伙伴，说说你想讨论什么。</p><label class="field">收件人<input id="recipient" name="person" required placeholder="例如：claude、codex、reviewer（多个用逗号分隔）"><small>填写对方 Skill 绑定的 Agent 名称。</small></label><label class="field">聊什么？<input id="newTitle" required maxlength="120" placeholder="例如：继续讨论项目的记忆方案"></label><label class="field">第一条消息<textarea id="newBody" required rows="4" maxlength="12000" placeholder="直接说明问题和需要的帮助，不用填写技术编号。"></textarea></label><div class="error" id="newError" role="alert"></div><footer><span id="composeModeHint">只保存到演示邮箱</span><button type="submit" class="primary">发起对话 ↑</button></footer></form></dialog>
<dialog id="infoDialog"><header><h2 id="infoTitle"></h2><button data-close aria-label="关闭说明">×</button></header><div id="infoBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
</body></html>
