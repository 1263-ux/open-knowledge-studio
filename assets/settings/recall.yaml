# v0.6.14: hook 参数统一原则 — 参数统一用 recall section（所有 hook 共用
# floor/topn/cooldown），各 hook 只在自己的 section 放行为模式差异（如
# posttool 的 mode/signal_rel_floor）。删 userprompt + posttool.floor/topn
# （posttool.floor=0.9 是 dead config，被 signal_rel_floor=2.5 覆盖；posttool.topn
# 统一到 recall.topn，signal 过滤后通常 <3 影响小）。
recall:
  floor: 0.7
  topn: 3
  minlen: 6
  cooldown: 10
posttool:
  mode: signal            # posttool 专有行为模式（signal=按 signal_rel_floor 过滤）
  signal_rel_floor: 2.5   # posttool 专有阈值（relevance > 此值才 signal）
conflict:
  window: 300
search_backend: fts5  # v0.6.0: 默认 fts5 node-level (吸收 TreeSearch, P@3=96%)
embedding_fallback: false  # v0.6.3: fts5 召回空/不足时切 embedding 补充（默认关, embedding 慢）
mail_topn: 3

# v0.6.0: Token Budget 分层注入（CV from karpathy-wiki L0-L3）
# recall 注入按预算截断，避免长 wiki 淹没上下文
inject:
  budget_chars: 4000      # 总注入预算（字符），约 1K token
  per_page_chars: 200     # 每页 body_preview 上限（L2 摘要级）
  title_only_floor: 0.5  # rel < 此值的只给 L0 标题行（不进 body）
