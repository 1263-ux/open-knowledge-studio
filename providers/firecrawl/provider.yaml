id: firecrawl
execution: external
label: Firecrawl
description: 远程网页抓取与解析。支持 JavaScript 渲染、结构化提取和 Office 文档解析（/parse）。通过 MCP 或 HTTP API 调用。

provides:
  web.fetch:
    maturity: validated
  web.extract:
    maturity: validated
  metadata.fetch:
    maturity: validated
  web.screenshot:
    maturity: experimental
  document.text.extract:
    maturity: validated_partial

requirements:
  env: [FIRECRAWL_API_KEY]
  mcp: firecrawl

cost:
  estimated_per_call: 1 credit

known_limits:
  - 中文平台（知乎、CSDN、掘金）可能被反爬
  - Office 公式和嵌入媒体可能丢失
  - /parse 返回结构可能不如原生工具
  - 不支持需要登录态的平台

last_validated: 2026-08-05

user_impact:
  install: "需要注册 Firecrawl 账号并获取 API Key"
  disk: "无本地磁盘占用（远程服务）"
  runtime: "远程执行，取决于 Firecrawl 服务响应速度"
  execution: "remote"
  privacy: "网页 URL 和抓取内容发送至 Firecrawl 服务器"
  cost: "按服务商当前定价计费，通常有免费额度；请以 Firecrawl 官网为准"
  skip_effect: "动态渲染页面（JS 重内容）可能无法获取完整正文"
