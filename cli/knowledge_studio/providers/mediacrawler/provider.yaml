id: mediacrawler
execution: external
label: MediaCrawler
description: 社交平台公开内容采集。支持小红书、抖音、B站、快手、微博、贴吧、知乎等平台的公开帖子、搜索和评论获取。需要用户自行安装 MediaCrawler。注意：OKS 集成尚未经过独立验证。

provides:
  social.content.fetch:
    maturity: experimental
  social.search:
    maturity: experimental
  social.comments.fetch:
    maturity: experimental
  social.creator.fetch:
    maturity: experimental
  metadata.fetch:
    maturity: experimental
  media.download:
    maturity: experimental

requirements: {}

platforms:
  - 小红书
  - 抖音
  - B站
  - 快手
  - 微博
  - 贴吧
  - 知乎

cost:
  estimated_per_call: 0

known_limits:
  - 需要用户自行安装 MediaCrawler（不捆绑进 OKS）
  - 仅支持公开内容，无法绕过登录墙
  - 所有能力均为 experimental — OKS 集成尚未经过独立验证
  - 评论和创作者信息为 experimental 状态

last_validated: null

user_impact:
  install: "需要安装 mediacrawler Python 包及平台相关依赖"
  disk: "未知，取决于目标和依赖"
  runtime: "本地执行，爬取速度取决于平台反爬策略"
  execution: "local"
  privacy: "请求发送至目标平台；本地文件不上传"
  cost: "免费"
  skip_effect: "社交平台公开内容可能无法批量获取"
