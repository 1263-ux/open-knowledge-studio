[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-knowledge-studio"
version = "0.2.4"
description = "File-based knowledge engineering CLI for Claude Code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{ name = "open-agent-power" }]
keywords = ["knowledge-base", "memory", "cli", "claude", "agent", "recall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-frontmatter>=1",
    "jieba>=0.42",
    "gitpython>=3",
    "pyyaml>=6",
]

[project.optional-dependencies]
document = ["markitdown[docx,pptx]==0.1.6"]
pdf = ["mineru[pipeline]==3.4.4", "six==1.17.0"]
watch = [
    "faster-whisper==1.2.1",
    "rapidocr==3.9.1",
    "onnxruntime==1.27.0",
    "scenedetect>=0.7,<0.8",
    "imagehash>=4.3,<5",
    "yt-dlp==2026.7.4",
    "watch-skill @ git+https://github.com/oxbshw/watch-skill.git@bf177b09a4c8a4d850c878f3965caecf971555e6",
]
formula = [
    "paddlepaddle==3.2.0",
    "paddleocr==3.7.0",
    "tokenizers==0.23.0",
    "ftfy==6.3.1",
]

[project.urls]
Homepage = "https://github.com/open-agent-power/open-knowledge-studio"
Repository = "https://github.com/open-agent-power/open-knowledge-studio"
Documentation = "https://open-agent-power.github.io/open-knowledge-studio/"

[project.scripts]
oks = "knowledge_studio.cli:app"
oks-connector = "raw_bundle_adapter:main"

[tool.setuptools]
include-package-data = false
py-modules = [
    "_shared",
    "capability_check",
    "constants",
    "digest",
    "feishu_setup",
    "formula_candidates",
    "i18n",
    "multimodal_feedback",
    "network",
    "raw_bundle_adapter",
    "route",
    "validator",
]
packages = ["knowledge_studio", "extractors"]

[tool.setuptools.package-dir]
"" = "../scripts"
"knowledge_studio" = "knowledge_studio"

[tool.setuptools.package-data]
knowledge_studio = ["_assets/**/*", "_assets/scripts/*.py"]
